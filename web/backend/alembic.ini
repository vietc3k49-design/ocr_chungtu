# Alembic - KIDO OCR Web.  (FILE NAY CHI DUNG ASCII: alembic doc .ini bang encoding locale,
# tren Windows cp1252 se vo neu co dau tieng Viet.)
# URL DB KHONG dat o day: alembic/env.py lay tu app.core.config.get_settings().database_url
# (bien moi truong DATABASE_URL; bat buoc co SECRET_KEY vi Settings yeu cau).
# Ghi de tam thoi: alembic -x db_url=postgresql+psycopg://... upgrade head
# Chay tu thu muc web/backend:  alembic upgrade head   |   alembic upgrade head --sql  (offline, in DDL)

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
