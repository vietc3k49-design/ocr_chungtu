# KIDO OCR web — chạy local: `docker compose up -d --build` (từ thư mục web/)
# Web: http://localhost:8080 · Mailpit (xem mail xác thực): http://localhost:8025
name: kido-ocr

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kido}:${POSTGRES_PASSWORD:-kido}@db:5432/${POSTGRES_DB:-kido}
    DATA_DIR: /data
    # api chỉ nhận request qua nginx (web) hoặc 127.0.0.1 ⇒ tin X-Real-IP để giới hạn đăng nhập theo IP thật.
    # ⚠️ Nếu mở cổng 8000 ra mạng ngoài thì PHẢI tắt (client tự đặt X-Real-IP được).
    TRUST_PROXY_HEADERS: "true"
    KIDO_REPO_ROOT: /repo
  volumes:
    - kido_data:/data
    # Gốc repo (tools/, config/, output/) — CHỈ ĐỌC: web không được ghi vào pipeline/artifact chính thức.
    - ..:/repo:ro
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kido}
      POSTGRES_DB: ${POSTGRES_DB:-kido}
    volumes:
      - kido_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # giao diện xem mail
    restart: unless-stopped

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy   # đợi migration xong

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kido_pg:
  kido_data:
